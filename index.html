<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日田なび | Hita City Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7fa', 100: '#e0eff5', 500: '#1b4353', 600: '#153644', accent: '#c89f5d' },
                        disaster: { 50: '#faf3f3', 100: '#f1dada', 200: '#e3bbbb', 300: '#cf8c8c', 400: '#b86565', 500: '#a63e3e', 600: '#8b3535', accent: '#a63e3e' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; position: fixed; inset: 0; overflow: hidden; width: 100vw; }
        #map { position: absolute; inset: 0; z-index: 1; }
        .leaflet-top { margin-top: 95px; }
        #sidebar { position: fixed; z-index: 100; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; width: 100%; }
        @media (max-width: 767px) {
            #sidebar { bottom: 0; left: 0; right: 0; height: 85vh; transform: translateY(calc(85vh - 80px)); }
            #sidebar.open { transform: translateY(0); }
            #sidebar.dragging { transition: none; }
            .leaflet-bottom.leaflet-right { bottom: 100px !important; transition: bottom 0.4s; }
        }
        @media (min-width: 768px) {
            #sidebar { top: 110px; left: 24px; width: 380px; height: calc(100vh - 134px); transform: none; }
            #sidebar.collapsed { transform: translateY(calc(100vh - 200px)) !important; }
            #sidebar.dragging { transition: none; }
        }
        .custom-scroll { -webkit-overflow-scrolling: touch; overflow-y: auto; overflow-x: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .lang-btn.active { background-color: #1b4353; color: white; border-color: #1b4353; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Fixed Top Header -->
    <header class="fixed top-0 left-0 right-0 z-[150] bg-white shadow-md border-b border-slate-100 px-4 py-2 flex flex-col justify-center h-[95px] md:h-[105px]">
        <div class="flex items-center justify-between w-full max-w-7xl mx-auto">
            <!-- 3-Line Logo Section -->
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="bg-brand-500 text-white w-10 h-10 md:w-14 md:h-14 rounded-xl flex-none flex items-center justify-center shadow-lg">
                    <i class="fas fa-map-marked-alt text-xl md:text-3xl"></i>
                </div>
                <div class="flex flex-col justify-center min-w-0">
                    <h1 id="header-title" class="text-brand-500 font-black text-base md:text-2xl leading-tight">日田なび</h1>
                    <span id="header-credit" class="text-[8px] md:text-[11px] text-slate-500 font-bold leading-tight truncate">created by 大分県立日田高校 79回生 SS情報班</span>
                    <p id="header-subtitle" class="text-[9px] md:text-[12px] text-slate-400 font-black uppercase tracking-widest leading-tight mt-0.5">Concierge Map</p>
                </div>
            </div>
            
            <!-- Actions Area -->
            <div class="flex flex-col items-end gap-2">
                <div id="lang-btns" class="flex gap-1 pointer-events-auto">
                    <button data-lang="ja" class="lang-btn px-2 py-1 rounded-md border border-slate-200 text-[9px] font-black transition-all active:scale-90">JA</button>
                    <button data-lang="en" class="lang-btn px-2 py-1 rounded-md border border-slate-200 text-[9px] font-black transition-all active:scale-90">EN</button>
                    <button data-lang="zh" class="lang-btn px-2 py-1 rounded-md border border-slate-200 text-[9px] font-black transition-all active:scale-90">ZH</button>
                    <button data-lang="ko" class="lang-btn px-2 py-1 rounded-md border border-slate-200 text-[9px] font-black transition-all active:scale-90">KO</button>
                </div>
                <button id="gps-btn" class="bg-brand-500 text-white w-9 h-9 md:w-11 md:h-11 rounded-xl shadow-md flex items-center justify-center active:scale-90 pointer-events-auto">
                    <i class="fas fa-location-arrow text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <div id="map"></div>

    <aside id="sidebar" class="pointer-events-none">
        <div class="bg-white/95 backdrop-blur-xl md:rounded-[24px] rounded-t-[32px] shadow-2xl border border-white/20 flex-1 flex flex-col overflow-hidden pointer-events-auto">
            
            <!-- Integrated Draggable Header -->
            <div id="drawer-handle" class="w-full flex flex-col items-center pt-3 pb-2 cursor-move select-none bg-slate-50/50 border-b border-slate-100/50 transition-colors hover:bg-slate-100/80">
                <div class="w-12 h-1.5 bg-slate-300 rounded-full mb-3"></div>
                <div class="w-full px-4">
                    <div class="grid grid-cols-2 gap-1 text-center font-black uppercase p-1 bg-white/50 rounded-[18px] border border-slate-200/50 shadow-sm">
                        <label class="cursor-pointer">
                            <input type="radio" name="mode" value="tourism" class="hidden peer" checked>
                            <div id="mode-label-tourism" class="py-2 rounded-[14px] text-[10px] md:text-xs peer-checked:bg-brand-500 peer-checked:text-white text-slate-400 transition-all">Tourism</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="mode" value="disaster" class="hidden peer">
                            <div id="mode-label-disaster" class="py-2 rounded-[14px] text-[10px] md:text-xs peer-checked:bg-disaster-500 peer-checked:text-white text-slate-400 transition-all">Disaster</div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex border-b border-slate-100 bg-white flex-none w-full">
                <button id="tab-btn-list" data-tab="list" class="flex-1 py-3 text-[10px] md:text-xs font-black text-brand-500 border-b-2 border-brand-500 transition-all uppercase">Find</button>
                <button id="tab-btn-info" data-tab="info" class="flex-1 py-3 text-[10px] md:text-xs font-black text-slate-400 border-b-2 border-transparent transition-all uppercase px-1 truncate">Route</button>
                <button id="tab-btn-extra" data-tab="extra" class="flex-1 py-3 text-[10px] md:text-xs font-black text-slate-400 border-b-2 border-transparent transition-all uppercase px-1">Info</button>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden w-full">
                <div id="search-section" class="p-4 bg-white border-b border-slate-50 space-y-3 flex-none w-full box-border">
                    <div class="relative w-full">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="search-input" class="w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-sm outline-none focus:ring-2 focus:ring-brand-500" placeholder="Search...">
                    </div>
                    <div id="category-chips" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar custom-scroll w-full"></div>
                    <div class="flex flex-wrap gap-2 pt-1">
                        <button id="filter-1km" class="px-3 py-1.5 rounded-xl border border-slate-200 text-[10px] font-bold bg-white text-slate-500 transition-all active:scale-95">1km以内</button>
                        <button id="filter-open" class="px-3 py-1.5 rounded-xl border border-slate-200 text-[10px] font-bold bg-white text-slate-500 transition-all active:scale-95">営業中</button>
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1 w-full border-t border-slate-50 mt-2">
                        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                            <i class="fas fa-sort-amount-down text-[10px] text-slate-400"></i>
                            <select id="sort-select" class="bg-transparent text-[10px] font-black text-slate-600 outline-none cursor-pointer">
                                <option value="dist" id="sort-opt-dist">距離順</option>
                                <option value="cat" id="sort-opt-cat">カテゴリ順</option>
                                <option value="name" id="sort-opt-name">名前順</option>
                            </select>
                        </div>
                        <div id="selected-count" class="text-[8px] md:text-[9px] font-black text-brand-500 bg-brand-50 px-2 py-1.5 rounded-lg border border-brand-100 flex-none"></div>
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1 w-full overflow-hidden">
                        <button id="optimize-btn" class="flex-1 bg-brand-500 text-white py-2.5 rounded-xl text-[10px] md:text-xs font-black shadow-lg uppercase truncate">ルート算出</button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4 w-full box-border" id="sidebar-scroll-area">
                    <div id="pane-list" class="space-y-3 w-full"><div id="spot-list" class="space-y-3 w-full"></div></div>
                    <div id="pane-info" class="hidden space-y-6 pb-10 w-full">
                        <div id="route-info" class="hidden bg-brand-50 p-5 rounded-[32px] border border-brand-100 shadow-sm space-y-4 w-full box-border">
                            <h3 class="text-brand-500 font-black text-sm flex items-center gap-2"><i class="fas fa-route"></i><span id="route-title-text">Route</span></h3>
                            <div id="route-stats" class="text-xs text-slate-600 space-y-2"></div>
                            <div class="grid grid-cols-2 gap-2 w-full">
                                <button id="add-more-btn" class="bg-white text-brand-500 border border-brand-100 py-3 rounded-2xl text-[10px] font-bold shadow-sm">Add</button>
                                <button id="reset-route-btn" class="bg-white text-disaster-500 border border-disaster-50 py-3 rounded-2xl text-[10px] font-bold shadow-sm">Reset</button>
                                </div>
                                <button id="gmaps-link-btn" class="w-full bg-green-600 text-white py-4 rounded-[20px] text-sm font-black shadow-lg">Google Maps</button>
                                </div>
                                <section class="bg-slate-50 p-5 rounded-[32px] border border-slate-100 space-y-4 w-full box-border">
                                <h3 id="ai-title-text" class="text-slate-700 font-bold text-sm truncate uppercase tracking-tight">AI Guide</h3>
                                <input type="password" id="gemini-key" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm outline-none" placeholder="API Key">
                                <div class="grid grid-cols-2 gap-2 w-full">
                                <input type="text" id="ai-input-1" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm" placeholder="...">
                                <input type="text" id="ai-input-2" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm" placeholder="...">
                                </div>
                                <div id="ai-interests" class="flex flex-wrap gap-2 w-full"></div>
                                <textarea id="ai-request" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm h-24 resize-none outline-none focus:ring-2 focus:ring-brand-500" placeholder="..."></textarea>
                                <button id="ai-btn" class="w-full bg-brand-accent text-white py-4 rounded-[20px] text-sm font-black shadow-lg uppercase">Plan</button>
                                <div id="ai-response" class="hidden text-xs leading-relaxed bg-white p-5 rounded-3xl border border-slate-100 max-h-80 overflow-y-auto w-full box-border shadow-inner"></div>
                                </section>
                                </div>
                                <div id="pane-extra" class="hidden space-y-4 pb-10 w-full"><div id="extra-content-list" class="space-y-4 w-full"></div></div>
                                </div>
                                </div>

                                <div class="p-4 bg-white border-t border-slate-50 text-center flex-none w-full box-border">
                                <button id="clear-btn" class="text-[9px] font-black text-slate-300 hover:text-disaster-500 uppercase tracking-[0.2em] w-full">Selection Reset</button>
                                </div>

        </div>
    </aside>

    <!-- Modal -->
    <div id="detail-modal" class="fixed inset-0 z-[300] flex items-center justify-center px-4 hidden w-full h-full box-border">
        <div id="modal-overlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="bg-white w-full max-w-sm rounded-[40px] shadow-2xl overflow-hidden relative transform transition-all p-6 flex flex-col max-h-[85vh] box-border">
            <div class="flex justify-between items-start mb-4 flex-none w-full">
                <h3 id="detail-title" class="text-brand-500 font-black text-lg leading-tight truncate pr-2"></h3>
                <button id="close-modal" class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center flex-none active:scale-90"><i class="fas fa-times"></i></button>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 overflow-y-auto flex-1 custom-scroll w-full box-border">
                <p id="detail-desc" class="text-xs text-slate-600 leading-relaxed font-medium"></p>
            </div>
            <button id="modal-select-btn" class="w-full py-4 rounded-[20px] text-sm font-black text-white shadow-xl flex-none active:scale-95 uppercase"></button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
